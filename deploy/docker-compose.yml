# compose untuk Dokploy (Compose Path: deploy/docker-compose.yml)
# Lokal: docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: db_data_tidur
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      TZ: Asia/Jayapura
    volumes:
      - db_data:/var/lib/mysql
      - ../database/db_data_tidur.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: db_data_tidur
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ""
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: db_data_tidur
      API_BASE: http://api:8000
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_FORCE_HTTPS: ${APP_FORCE_HTTPS:-1}
      APP_BEHIND_PROXY: ${APP_BEHIND_PROXY:-1}
      INSTALL_ADMIN_USERNAME: ${INSTALL_ADMIN_USERNAME:-admin}
      INSTALL_ADMIN_PASSWORD: ${INSTALL_ADMIN_PASSWORD}
      INSTALL_VIEWER_USERNAME: ${INSTALL_VIEWER_USERNAME:-viewer}
      INSTALL_VIEWER_PASSWORD: ${INSTALL_VIEWER_PASSWORD}
      TZ: Asia/Jayapura
    volumes:
      - uploads_data:/var/www/html/uploads
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/data.php?action=landing"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  uploads_data:
